<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIX Pingupag - Loja 05</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #f8f9ff;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        #resultado {
            margin-top: 30px;
            padding: 24px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #resultado.sucesso {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }
        #resultado.erro {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }
        #resultado h3 {
            margin-bottom: 15px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #resultado p {
            margin-bottom: 10px;
            line-height: 1.6;
            font-size: 14px;
        }
        #resultado strong {
            font-weight: 600;
        }
        .qr-container {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }
        .qr-container h4 {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
        }
        .qr-container canvas {
            max-width: 280px;
            border: 3px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            background: white;
        }
        .pix-code {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            line-height: 1.6;
            max-height: 120px;
            overflow-y: auto;
        }
        .pix-label {
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .copy-btn {
            background: #28a745;
            padding: 11px 20px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #004085;
        }
        .info-box strong {
            color: #002752;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Gerar PIX</h1>
            <p>Loja 05</p>
            <div class="badge">✓ Pingupag - Gateway de Pagamento</div>
        </div>

        <div class="info-box">
            <strong>ℹ️ Informação:</strong> Preencha os dados abaixo para gerar um código PIX válido.
        </div>
        
        <form id="formulario">
            <div class="form-group">
                <label><i class="fas fa-money-bill"></i> Valor (R$):</label>
                <input type="number" id="valor" step="0.01" value="89.90" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nome:</label>
                <input type="text" id="nome" value="Cliente Teste" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email:</label>
                <input type="email" id="email" value="teste@example.com" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> CPF:</label>
                <input type="text" id="cpf" value="12345678900" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Telefone:</label>
                <input type="text" id="telefone" value="11987654321" required>
            </div>
            
            <button type="submit" id="btn">
                <i class="fas fa-mobile-alt"></i> Gerar PIX
            </button>
        </form>
        
        <div id="resultado"></div>
    </div>

    <script>
        const API_KEY = 'pingupag_sk_5a4a884661598e034154315cc12ce8e55ebfd026625c057dcf673b7ca7512384';
        const API_URL = 'https://app.pingupag.com/gateway/v1/transaction';

        document.getElementById('formulario').addEventListener('submit', async (e) => {
            e.preventDefault();
            await gerar();
        });

        async function gerar() {
            const btn = document.getElementById('btn');
            const resultado = document.getElementById('resultado');
            
            btn.disabled = true;
            btn.textContent = '⏳ Gerando PIX...';
            resultado.innerHTML = '';
            
            try {
                const valor = parseFloat(document.getElementById('valor').value);
                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
                const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
                
                const amount = Math.round(valor * 100);
                const ref = `loja05_${Date.now()}`;

                const payload = {
                    amount: amount,
                    description: 'Loja 05',
                    reference: ref,
                    source: 'api_externa',
                    customer: {
                        name: nome,
                        email: email,
                        document: cpf,
                        phone: telefone
                    },
                    address: {
                        city: 'São Paulo',
                        state: 'SP',
                        street: 'Rua Teste',
                        number: '0',
                        zipcode: '00000000'
                    }
                };

                console.log('📤 Enviando:', payload);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('📥 Resposta:', data);

                if (data.status === 'success') {
                    exibir_sucesso(data, valor);
                } else {
                    throw new Error(data.message || 'Erro ao gerar');
                }

            } catch (erro) {
                console.error('Erro:', erro);
                resultado.className = 'erro';
                resultado.innerHTML = `<h3><i class="fas fa-exclamation-circle"></i> Erro</h3><p>${erro.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '<i class="fas fa-mobile-alt"></i> Gerar PIX';
            }
        }

        function exibir_sucesso(data, valor) {
            const resultado = document.getElementById('resultado');
            resultado.className = 'sucesso';
            
            const pix = data.qr_code;
            
            resultado.innerHTML = `
                <h3><i class="fas fa-check-circle"></i> PIX Gerado com Sucesso!</h3>
                <p><strong>ID da Transação:</strong> <code>${data.transaction_id}</code></p>
                <p><strong>Valor:</strong> <strong style="color: #28a745; font-size: 18px;">R$ ${valor.toFixed(2)}</strong></p>
                <p><strong>Status:</strong> <span style="color: #28a745; font-weight: 600;">✓ ${data.status.toUpperCase()}</span></p>
                
                <div class="qr-container">
                    <h4>📱 Escaneie o QR Code com seu banco:</h4>
                    <div id="qr"></div>
                </div>
                
                <div class="pix-label">📋 Ou copie o código PIX abaixo:</div>
                <div class="pix-code">${pix}</div>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${pix}'); alert('✓ PIX copiado com sucesso!')">
                    <i class="fas fa-copy"></i> Copiar PIX
                </button>
                
                <p style="margin-top: 20px; font-size: 12px; color: #666; text-align: center;">
                    ✓ Gerado em ${new Date().toLocaleString('pt-BR')}
                </p>
            `;
            
            // QR Code
            try {
                document.getElementById('qr').innerHTML = '';
                new QRCode(document.getElementById('qr'), {
                    text: pix,
                    width: 250,
                    height: 250
                });
            } catch (e) {
                console.log('Erro ao gerar QR:', e);
            }
        }
    </script>
</body>
</html>
