<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador PIX Pingupag - Loja 05</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .resultado {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }
        
        .resultado.sucesso {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }
        
        .resultado.erro {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }
        
        .resultado h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .resultado p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .pix-code {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            word-break: break-all;
            font-size: 12px;
            font-family: monospace;
            margin: 15px 0;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .qr-code {
            text-align: center;
            margin: 20px 0;
        }
        
        .qr-code img {
            max-width: 250px;
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 4px;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #764ba2;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Gerador PIX Pingupag</h1>
        <p class="subtitle">Loja 05 - Teste da Gateway</p>
        
        <form id="formulario">
            <div class="form-group">
                <label for="valor">Valor (R$) *</label>
                <input type="number" id="valor" step="0.01" value="89.90" required>
            </div>
            
            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" value="Teste Cliente" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" value="teste@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" value="12345678900" required>
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone *</label>
                <input type="text" id="telefone" value="11987654321" required>
            </div>
            
            <button type="submit" id="btn-gerar">🚀 Gerar PIX na Pingupag</button>
        </form>
        
        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        // Configuração Pingupag
        const PINGUPAG_API_KEY = 'pingupag_sk_5a4a884661598e034154315cc12ce8e55ebfd026625c057dcf673b7ca7512384';
        const PINGUPAG_URL = 'https://app.pingupag.com/gateway/v1/transaction';

        document.getElementById('formulario').addEventListener('submit', async function(e) {
            e.preventDefault();
            await gerarPix();
        });

        async function gerarPix() {
            const btn = document.getElementById('btn-gerar');
            const resultado = document.getElementById('resultado');
            
            try {
                // Desabilita botão
                btn.disabled = true;
                btn.textContent = '⏳ Processando...';
                resultado.innerHTML = '';
                
                // Coleta dados do formulário
                const valor = parseFloat(document.getElementById('valor').value);
                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const cpf = document.getElementById('cpf').value;
                const telefone = document.getElementById('telefone').value;
                
                // Valida
                if (!valor || !nome || !email || !cpf || !telefone) {
                    throw new Error('Preencha todos os campos!');
                }
                
                // Converte para centavos
                const amount = Math.round(valor * 100);
                const reference = `loja05_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                
                // Monta payload
                const payload = {
                    amount: amount,
                    description: 'Loja 05',
                    reference: reference,
                    source: 'api_externa',
                    customer: {
                        name: nome,
                        email: email,
                        document: cpf.replace(/\D/g, ''),
                        phone: telefone.replace(/\D/g, '')
                    },
                    address: {
                        city: 'São Paulo',
                        state: 'SP',
                        street: 'Rua Teste',
                        number: '0',
                        zipcode: '00000000'
                    },
                    tracking: {
                        utm_source: 'test',
                        utm_campaign: 'loja05'
                    }
                };
                
                console.log('📤 Enviando payload:', payload);
                
                // Faz requisição
                const response = await fetch(PINGUPAG_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': PINGUPAG_API_KEY
                    },
                    body: JSON.stringify(payload)
                });
                
                const dados = await response.json();
                console.log('📥 Resposta:', dados);
                
                if (!response.ok) {
                    throw new Error(dados.message || `Erro ${response.status}`);
                }
                
                if (dados.status !== 'success') {
                    throw new Error('Falha ao gerar PIX');
                }
                
                // Sucesso!
                exibirSucesso(dados, amount, valor);
                
            } catch (erro) {
                console.error('❌ Erro:', erro);
                resultado.classList.remove('sucesso');
                resultado.classList.add('erro');
                resultado.innerHTML = `
                    <h3>❌ Erro ao Gerar PIX</h3>
                    <p>${erro.message}</p>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Gerar PIX na Pingupag';
            }
        }

        function exibirSucesso(dados, amountCentavos, valorReais) {
            const resultado = document.getElementById('resultado');
            resultado.classList.remove('erro');
            resultado.classList.add('sucesso');
            
            const pixCode = dados.qr_code;
            
            resultado.innerHTML = `
                <h3>✅ PIX Gerado com Sucesso!</h3>
                
                <p><strong>ID da Transação:</strong> ${dados.transaction_id}</p>
                <p><strong>Valor:</strong> R$ ${valorReais.toFixed(2)}</p>
                <p><strong>Status:</strong> ${dados.status}</p>
                <p><strong>Referência:</strong> ${dados.id}</p>
                
                <div class="qr-code">
                    <h4>📱 QR Code PIX:</h4>
                    <div id="qrcode-container"></div>
                </div>
                
                <div>
                    <p><strong>Copia e Cola:</strong></p>
                    <div class="pix-code">${pixCode}</div>
                    <button class="copy-btn" onclick="copiarPix('${pixCode}')">📋 Copiar PIX</button>
                </div>
                
                <p style="margin-top: 15px; font-size: 12px; color: #666;">
                    ✓ Gerado em ${new Date().toLocaleString('pt-BR')}
                </p>
            `;
            
            // Gera QR Code se a biblioteca estiver disponível
            try {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
                script.onload = function() {
                    const container = document.getElementById('qrcode-container');
                    if (container) {
                        new QRCode(container, {
                            text: pixCode,
                            width: 200,
                            height: 200,
                            colorDark: '#000000',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                };
                document.head.appendChild(script);
            } catch (e) {
                console.log('QR Code library not available, showing text only');
            }
        }

        function copiarPix(pix) {
            navigator.clipboard.writeText(pix).then(() => {
                alert('✓ PIX copiado para a área de transferência!');
            }).catch(() => {
                alert('Erro ao copiar. Copie manualmente.');
            });
        }
    </script>
</body>
</html>
